# Builds every client on push and publishes dist/ as one artifact.
#
# The deploy step is intentionally left for you to fill in: where this goes depends on the hosting
# decision, and a half-configured deploy that silently publishes to the wrong place is worse than
# no deploy. Cloudflare Pages is the one that pairs with Cloudflare Access; the commented block
# below is what that looks like.
#
# The verify step is NOT optional. It is what stops a build that leaked one client's content into
# another's folder from ever reaching the host.
name: Build client docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because showLastUpdateTime reads git history. The default shallow
      # clone (depth 1) makes every page report the same date, or fails the build outright.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build every client
        run: npm run build
        env:
          # The ORIGIN only, e.g. https://hussnain-utechhub.github.io
          SITE_URL: ${{ vars.SITE_URL }}
          # The DIRECTORY the hub hangs under, and the one people forget. A GitHub Pages PROJECT
          # site serves from /<repo>/, so this is "/docs-hub". A custom domain serves from the
          # root, so leave it unset. Wrong value = every asset one directory too high, and the
          # site deploys green while rendering unstyled.
          BASE_PREFIX: ${{ vars.BASE_PREFIX }}

      - name: Verify per-client isolation
        run: npm run verify
        env:
          BASE_PREFIX: ${{ vars.BASE_PREFIX }}

      - uses: actions/upload-artifact@v4
        with:
          name: client-sites
          path: dist/
          retention-days: 7

      # Pages publishes ONE directory, and dist/ already holds one folder per client, so the
      # whole of dist/ is the artifact: each client lands at /<repo>/<client>/.
      - name: Upload Pages artifact
        if: vars.PUBLISH_TARGET == 'github-pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # --- The eventual gated host. Uncomment once the domain is settled. ---
      #
      # - name: Publish to Cloudflare Pages
      #   uses: cloudflare/wrangler-action@v3
      #   with:
      #     apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #     command: pages deploy dist --project-name=docs-hub

  # ===========================================================================================
  # GITHUB PAGES - A TEST TARGET ONLY, AND IT IS PUBLIC.
  #
  # A Pages site is readable by the ENTIRE INTERNET. Private Pages is a GitHub Enterprise Cloud
  # feature, so making the repository private does not make the site private: it protects the
  # source and nothing else. There is NO access gate on this path - any client folder published
  # here can be read by anyone who guesses the URL.
  #
  # That is acceptable only while every client/ folder is a fictional demo. BEFORE THE FIRST REAL
  # CLIENT: clear the PUBLISH_TARGET variable, disable Pages in Settings, and move to the gated
  # host above. See internal/access-rules.md.
  #
  # It stays opt-in: nothing publishes unless the repo variable PUBLISH_TARGET is set to
  # "github-pages", so this job cannot fire by accident.
  # ===========================================================================================
  deploy:
    needs: build
    if: vars.PUBLISH_TARGET == 'github-pages'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
